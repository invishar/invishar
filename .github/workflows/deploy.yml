name: Deploy ke Domainesia

# Jalan otomatis setiap kali ada push ke branch main.
# Bisa juga dijalankan manual dari tab Actions (tombol "Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

# Kalau ada dua push beruntun, batalkan yang lama supaya tidak bentrok
# saling menimpa file di server.
concurrency:
  group: deploy-produksi
  cancel-in-progress: false

jobs:
  deploy:
    name: Unggah isi site/ ke hosting
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode dari repo
        uses: actions/checkout@v4

      - name: Unggah lewat FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          # Hanya isi folder site/ yang diunggah — bukan seluruh repo.
          local-dir: ./site/

          # './' artinya folder home milik akun FTP itu sendiri.
          # Kalau akun FTP dibuat dengan directory "public_html", biarkan './'.
          # Kalau memakai akun cPanel utama, ganti jadi './public_html/'.
          server-dir: ./

          # Domainesia mendukung FTPS (FTP + TLS) di port 21.
          # Kalau gagal tersambung, ganti ke: protocol: ftp
          protocol: ftps
          port: 21

          # Jangan ikut diunggah ke server.
          exclude: |
            **/.git*
            **/.git*/**
            **/README.md
            **/.DS_Store
