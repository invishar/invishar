---
# Resep deploy untuk Git Deploy Manager di cPanel Domainesia.
# Dijalankan otomatis setiap kali ada push ke remote cPanel (mode CI/CD).
#
# Inti aturannya: HANYA isi folder site/ yang boleh masuk ke public_html.
# Folder design-source/, DEPLOY.md, dan berkas repo lain tetap di Git saja.
deployment:
  tasks:
    # Pastikan folder tujuannya ada.
    - /bin/mkdir -p ~/public_html

    # Salin ISI site/ ke public_html.
    # Perhatikan "site/." (pakai titik), bukan "site/*" — titik ikut
    # menyalin berkas tersembunyi seperti .htaccess, sedangkan * melewatkannya.
    - /bin/cp -R site/. ~/public_html/

    # Catatan teknis untuk pengembang, tidak perlu bisa diakses pengunjung.
    - /bin/rm -f ~/public_html/README.md

    # Catat waktu deploy terakhir, berguna untuk memastikan deploy benar jalan.
    # Cek kapan saja di: https://invishar.com/deploy-terakhir.txt
    #
    # Tanda kutip tunggal di bawah WAJIB ada: tanpa itu, tanda ":" dan "%"
    # di dalam format tanggal membuat berkas YAML ini gagal dibaca.
    - '/bin/date "+Deploy terakhir: %Y-%m-%d %H:%M:%S %Z" > ~/public_html/deploy-terakhir.txt'
