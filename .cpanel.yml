---
# Resep deploy untuk Git Deploy Manager di cPanel Domainesia.
# Dijalankan otomatis setiap kali ada push ke remote cPanel (mode CI/CD).
#
# Inti aturannya: HANYA isi folder site/ yang boleh masuk ke public_html.
# Folder design-source/, DEPLOY.md, dan berkas repo lain tetap di Git saja.
deployment:
  tasks:
    # Pastikan folder tujuannya ada.
    - /bin/mkdir -p ~/public_html

    # Salin ISI site/ ke public_html.
    # Perhatikan "site/." (pakai titik), bukan "site/*" — titik ikut
    # menyalin berkas tersembunyi seperti .htaccess, sedangkan * melewatkannya.
    - /bin/cp -R site/. ~/public_html/

    # Catatan teknis untuk pengembang, tidak perlu bisa diakses pengunjung.
    - /bin/rm -f ~/public_html/README.md

    # Halaman "Ready to Launch" bawaan Domainesia. Deploy tidak menghapus
    # berkas yang tidak dilacak Git, jadi harus dibuang eksplisit — kalau
    # dibiarkan ia bisa merebut posisi halaman depan.
    #
    # Nama berkas aslinya "default-welcome.html"; server Domainesia juga
    # menyajikannya di URL /default.html, jadi dua-duanya disapu.
    - /bin/rm -f ~/public_html/default-welcome.html
    - /bin/rm -f ~/public_html/default.html

    # --- Panel admin -----------------------------------------------------
    # Dipasang di public_html/panel, jadi langsung hidup di
    # https://invishar.com/panel/ tanpa menunggu subdomain. Saat subdomain
    # panel.invishar.com dibuat nanti, arahkan Document Root-nya ke folder
    # yang sama ini — tidak ada yang perlu diubah di sini.
    #
    # inc/konfig.php tidak ikut tersalin (tidak ada di Git), jadi kata sandi
    # basis data yang sudah diisi di server tidak tertimpa tiap deploy.
    - /bin/mkdir -p ~/public_html/panel
    - /bin/cp -R panel/. ~/public_html/panel/

    # --- Sistem affiliate ---------------------------------------------------
    # mitra/  portal affiliator      → https://invishar.com/mitra/
    # toko/   link /r/, checkout, status bayar, webhook Midtrans
    # Keduanya memakai pustaka di public_html/panel/inc (termasuk konfig.php
    # yang sudah ada di server), jadi tidak ada konfigurasi tambahan.
    - /bin/mkdir -p ~/public_html/mitra
    - /bin/cp -R mitra/. ~/public_html/mitra/
    - /bin/mkdir -p ~/public_html/toko
    - /bin/cp -R toko/. ~/public_html/toko/

    # Catat waktu deploy terakhir, berguna untuk memastikan deploy benar jalan.
    # Cek kapan saja di: https://invishar.com/deploy-terakhir.txt
    #
    # Harus dibungkus /bin/sh -c: cPanel menjalankan tiap tugas tanpa shell,
    # jadi tanda ">" tidak diartikan sebagai pengalihan keluaran dan berkasnya
    # tidak pernah terbentuk. Kutip tunggal di luar menjaga YAML tetap sah.
    - '/bin/sh -c "date > ~/public_html/deploy-terakhir.txt"'
